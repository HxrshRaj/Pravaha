name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit + failure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check pravaha tests
      - name: Mypy (non-blocking)
        run: mypy pravaha || true
      - name: Unit + failure tests
        run: pytest tests/unit tests/failure -q --cov=pravaha --cov-report=term-missing
      - name: Alembic sanity (offline SQL render)
        run: alembic upgrade head --sql > /dev/null
        env:
          POSTGRES_HOST: localhost

  backend-integration:
    name: Backend integration (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Integration tests (Docker available on GitHub runners)
        run: pytest -m integration -q
        timeout-minutes: 25

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  compose-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t pravaha-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t pravaha-web:ci .
      - name: Validate compose
        run: docker compose config -q
