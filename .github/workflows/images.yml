name: images

# Build the two runtime images and push them to GitHub Container Registry
# (free for public repos). Deployment then just `docker compose pull`s them -
# no building on a tiny always-free VM.
#
# Images:
#   ghcr.io/<owner>/pravaha-app:{latest,<sha>,<tag>}   (API + every worker)
#   ghcr.io/<owner>/pravaha-web:{latest,<sha>,<tag>}   (Next.js dashboard)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            dockerfile: infrastructure/docker/Dockerfile.api
          - name: web
            dockerfile: infrastructure/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/pravaha-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # The web image uses a same-origin relative API base in prod, so it is
          # built with an empty NEXT_PUBLIC_API_BASE_URL.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
