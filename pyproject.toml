[project]
name = "pravaha"
version = "0.1.0"
description = "Pravaha - Real-Time Data Streaming & Event Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Harsh Raj" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.37",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.4",
    "alembic==1.14.1",
    "aiokafka==0.14.0",
    "redis==5.2.1",
    "orjson==3.10.15",
    "structlog==25.1.0",
    "prometheus-client==0.21.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "numpy==2.2.2",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "jsonschema==4.23.0",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "anyio==4.8.0",
    "ruff==0.9.3",
    "mypy==1.14.1",
    "faker==35.0.0",
    "testcontainers[postgres,redis,kafka]==4.9.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pravaha*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires Docker-backed infrastructure (pg/redis/kafka)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI Depends() in defaults is idiomatic. E501: long lines tolerated.
# UP038: isinstance tuple form is fine (and the | form is itself being walked back).
# SIM105/108/115, C40x: readability-neutral rewrites we don't enforce.
ignore = [
    "B008", "E501", "UP038",
    "SIM105", "SIM108", "SIM115",
    "C401", "C402", "C408", "C414", "C416",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
